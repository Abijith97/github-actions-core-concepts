name: Test a docker image
on: push
jobs:
    deploy:
        strategy:
            max-parallel: 2
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                images: [hello-world, alpine]
                exclude:
                    - os: windows-latest
                      image: alpine
                include:
                    - os: ubuntu-latest
                      image: node:alpine
        runs-on: ${{ matrix.os }}
        steps:
          - name: Create a ${{ matrix.images }} container on ${{ matrix.os }}
            run: docker run ${{ matrix.images }}
    