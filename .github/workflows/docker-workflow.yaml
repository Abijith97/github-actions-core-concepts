name: Test a docker image
on: push
jobs:
    deploy:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                images: [hello-world, nginx]
        runs-on: ${{ matrix.os }}
        steps:
          - name: Create a ${{ matrix.images }} container on ${{ matrix.os }}
            run: docker run ${{ matrix.images }}
    